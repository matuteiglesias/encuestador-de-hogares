[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "encuestador-de-hogares"
version = "0.1.0"
description = "Governed EPH-to-Census household welfare transport experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23,<3",
  "scikit-learn>=1.3,<2",
  "PyYAML>=6,<7",
]

[project.scripts]
encuestador = "encuestador.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["encuestador*"]
namespaces = true
