architecture:
  id: direct_v1
  nodes: {}
terminal:
  id: direct_linear_income_v1
  prediction_unit: person
  target: P47T
  formulation: direct_regression
  scale: linear
estimators:
  id: hgb_primary_v1
  roles:
    terminal:
      family: hgb
      task: regression
      loss: squared_error
      categorical_features: [P02, V01, H05, H06, H07, H08, H09, H10, H11, H12, H15, PROP, H14, H13, P07, P08, P09, P10, P05, CONDACT]
