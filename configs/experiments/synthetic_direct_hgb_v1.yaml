        random_state: 42
splits:
  id: household_grouped_5fold_v1
  strategy: household_grouped_v1
  group_columns: [CODUSU, NRO_HOGAR]
  n_splits: 5
  seed: 42
calibration:
  id: raw_v1
  method: raw
anchors: null
uncertainty:
  id: core_v1
  categorical_probabilities: true
  quantiles: false
  household_cluster_bootstrap: false
evaluation:
  id: welfare_core_v1
  person_metrics: [mae, rmse, mean_error]
  household_metrics: [mae, rmse, mean_error]
  distributional_metrics: []
  oracle:
    enabled: false
