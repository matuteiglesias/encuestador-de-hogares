binding_id: research.eph-census.real-input-binding/2024q3-census2024-v1
status: pinned_semantic_review_required
purpose: >-
  Freeze the exact real producer releases used by the first bounded EPH-to-Census
  transport qualification. This binding is lineage and validated producer custody,
  not semantic approval and not authorization to score Census.

