semantic_authority:
  repository: matuteiglesias/eph-censo-aligner
  required_review_inventory: historical_staged_v1_legacy_bridge
  requested_concept_count: 23
  approval_policy: >-
    Review all 23 historical bridge concepts against these exact releases, but
    approve only source-backed concepts justified for the active P0/P1 plane.

execution_order:
- validate producer release contracts and exact identities
- complete real semantic review and emit the approved feature plane
- run P0 versus approved-P1 Gamma on EPH only
- adjudicate scientific promotion using governed diagnostics
- only then authorize bounded Census scoring

hard_gates:
- census_scoring_before_semantic_approval: forbidden
- census_scoring_before_p0_p1_eph_adjudication: forbidden
- sampler_v1_input: forbidden
- fuzzy_or_positional_identity_join: forbidden
- global_oof_residual_reuse_for_predictive_distribution: forbidden
- outer_test_households_in_predictive_distribution_calibration: forbidden
