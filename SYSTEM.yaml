  - execute encuestador's own v2 custody/intake check against the exact local sample when the local artifact is mounted in the runtime
  - integrate landed science-diagnostics helpers into governed P0/P1 run evidence where they are not yet emitted by runner/run bundles
  - approve the resulting real Census scoring feature plane and transport-time roles before Census scoring
