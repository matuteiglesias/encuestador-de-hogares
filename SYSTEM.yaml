scientific_invariants:
- external Census inputs must be approved shared_observable or derived_shared features from an exact alignment release
- semantic shared_observable does not imply that a donor-vintage Census value is observed at the welfare period
- every deployable Census feature must have an explicit transport-time role before consequential scoring
- learned stage targets may be used downstream only through out-of-fold predictions during training and fitted predictions during scoring
- observed stage labels must never replace predicted stage outputs in downstream training evidence
- approved OOF policy must respect household or stronger grouping once exact EPH household identity is available
- nested predictive-distribution calibration must use inner household OOF evidence from the outer-training partition only; outer-test households must never contribute calibration residuals
- a direct shared-information -> terminal-welfare baseline is required before staged complexity is promoted
- target-period aggregate calibration is optional, explicit and diagnosed; it may not silently rewrite donor observations
- EPH validation alone does not establish Census transport validity
- semantic alignment alone does not establish statistical transport validity
- sample/person/household identity must match exactly across scoring and welfare releases; no positional or fuzzy join is permitted
- EPH survey weights, Census selection probabilities and downstream poverty analysis weights are distinct semantics
- monetary transforms and price references must be explicit and resolved through a versioned monetary-conversion release before welfare handoff
- poverty consumes welfare semantics, never model-native latent/log prediction values
