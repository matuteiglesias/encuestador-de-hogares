name: Weekly welfare research pulse

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/scheduled-transport-maturity.yml
      - .github/workflows/synthetic-transport-ci.yml
      - .github/workflows/real-eph-2024q3-acceptance.yml
      - pyproject.toml
      - requirements-science.txt
      - contracts/**
      - configs/experiments/**
      - src/encuestador/**
      - scripts/synthetic_transport_smoke.py
      - science/2026-09-11/build_predictive_welfare_release.py
      - tests/**
  schedule:
    - cron: "17 12 * * 3"

permissions:
  contents: read

concurrency:
  group: weekly-welfare-research-pulse
  cancel-in-progress: false

jobs:
  maturity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded proof dependencies
        run: python -m pip install -e . pytest ruff pandas pyarrow

      - name: Validate governing contract files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import yaml

          required = [
              Path("SYSTEM.yaml"),
              Path("contracts/functional_interface.yaml"),
              Path("contracts/deployment_dag.yaml"),
              Path("contracts/model_specs/historical_staged_v1.json"),
              Path("fixtures/semantic_plane/synthetic_fixture_v1.json"),
          ]
          for path in required:
              if not path.is_file():
                  raise SystemExit(f"Missing governing contract: {path}")
              if path.suffix == ".json":
                  value = json.loads(path.read_text(encoding="utf-8"))
              else:
                  value = yaml.safe_load(path.read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise SystemExit(f"Expected mapping in {path}")
          print("Governing transport contracts parse successfully")
          PY

      - name: Run deterministic synthetic transport executor
        run: python scripts/synthetic_transport_smoke.py > /tmp/synthetic-proof.json

      - name: Verify current predictive-welfare release surface
        run: |
          test -f science/2026-09-11/build_predictive_welfare_release.py
          ruff check science/2026-09-11/build_predictive_welfare_release.py
          python -m py_compile science/2026-09-11/build_predictive_welfare_release.py
          python science/2026-09-11/build_predictive_welfare_release.py --help >/tmp/predictive-welfare-help.txt
          python - <<'PY'
          from pathlib import Path
          text = Path("science/2026-09-11/build_predictive_welfare_release.py").read_text(encoding="utf-8")
          required = [
              'research.household-welfare-predictive/v1',
              'additive_empirical_residual_ecdf',
              'floor_at_zero',
              'household_total_family_income',
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f"predictive-welfare contract markers missing: {missing}")
          print("Predictive-welfare release contract surface is present")
          PY

      - name: Summarize maturity state
        if: always()
        run: |
          {
            echo "## Weekly welfare research pulse"
            echo
            echo "A green result proves the executable transport contracts, synthetic end-to-end mechanics, and the governed research.household-welfare-predictive/v1 release surface remain intact."
            echo
            echo "The separate Real EPH 2024-Q3 acceptance workflow is the expensive reproducibility job and now runs on its own weekly schedule."
            echo
            echo "Hosted CI still does **not** recreate the large local Census scoring artifacts. Q8 transport caveats, local Census/semantic materialization, and aggregate uncertainty remain explicit boundaries rather than being silently promoted."
          } >> "$GITHUB_STEP_SUMMARY"
