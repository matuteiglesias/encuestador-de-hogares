name: Longitudinal C4 CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/longitudinal-c4-ci.yml
      - configs/longitudinal/**
      - contracts/longitudinal_runtime.yaml
      - docs/LONGITUDINAL_WELFARE_C4_IMPLEMENTATION.md
      - src/encuestador/anchors.py
      - src/encuestador/longitudinal_intake.py
      - src/encuestador/longitudinal_c6.py
      - src/encuestador/longitudinal_gate_b.py
      - src/encuestador/longitudinal_c7_contract.py
      - src/encuestador/longitudinal_c7.py
      - src/encuestador/longitudinal_c7_run.py
      - src/encuestador/longitudinal_c8.py
      - src/encuestador/longitudinal_c8_run.py
      - src/encuestador/longitudinal_runtime.py
      - src/encuestador/time_layer.py
      - src/encuestador/cli.py
      - tests/test_longitudinal_runtime.py
      - tests/test_longitudinal_c6.py
      - tests/test_longitudinal_gate_b.py
      - tests/test_longitudinal_c7_contract.py
      - tests/test_longitudinal_c7.py
      - tests/test_longitudinal_c8.py
      - docs/C6_RESOURCE_SAFE_LONGITUDINAL_EXECUTION.md
      - docs/GATE_B_MINIMAL_PANEL_EVIDENCE.md
      - docs/C7_DONOR_CLOCK_MATCHED_L11_CONTRACT.md
      - docs/C7A_RESOURCE_SAFE_L11_EXECUTION.md
      - docs/C8_RAW_L12_CLOUD_IMPLEMENTATION.md
      - docs/C8_LOCAL_LOOP_CLOSURE.md
      - docs/LABOR_CONDACT_HISTORICAL_REPAIR_20261001.md
      - docs/L4_REAL_LONGITUDINAL_WELFARE_COMMISSIONING.md
      - README.md
      - SYSTEM.yaml
  push:
    branches: [main]
    paths:
      - .github/workflows/longitudinal-c4-ci.yml
      - configs/longitudinal/**
      - src/encuestador/anchors.py
      - src/encuestador/longitudinal_intake.py
      - src/encuestador/longitudinal_c6.py
      - src/encuestador/longitudinal_gate_b.py
      - src/encuestador/longitudinal_c7_contract.py
      - src/encuestador/longitudinal_c7.py
      - src/encuestador/longitudinal_c7_run.py
      - src/encuestador/longitudinal_c8.py
      - src/encuestador/longitudinal_c8_run.py
      - src/encuestador/longitudinal_runtime.py
      - src/encuestador/time_layer.py
      - src/encuestador/cli.py
      - tests/test_longitudinal_runtime.py
      - tests/test_longitudinal_gate_b.py
      - tests/test_longitudinal_c7_contract.py
      - tests/test_longitudinal_c7.py
      - tests/test_longitudinal_c8.py

permissions:
  contents: read

jobs:
  c4-fixture-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and bounded science dependencies
        run: python -m pip install -e . pytest ruff pandas pyarrow

      - name: Lint C4 boundary
        run: >-
          ruff check
          src/encuestador/anchors.py
          src/encuestador/longitudinal_intake.py
          src/encuestador/longitudinal_c6.py
          src/encuestador/longitudinal_gate_b.py
          src/encuestador/longitudinal_c7_contract.py
          src/encuestador/longitudinal_c7.py
          src/encuestador/longitudinal_c7_run.py
          src/encuestador/longitudinal_c8.py
          src/encuestador/longitudinal_c8_run.py
          src/encuestador/longitudinal_runtime.py
          src/encuestador/time_layer.py
          src/encuestador/cli.py
          tests/test_longitudinal_runtime.py
          tests/test_longitudinal_c6.py
          tests/test_longitudinal_gate_b.py
          tests/test_longitudinal_c7_contract.py
          tests/test_longitudinal_c7.py
          tests/test_longitudinal_c8.py

      - name: Compile C4 boundary
        run: >-
          python -m py_compile
          src/encuestador/anchors.py
          src/encuestador/longitudinal_intake.py
          src/encuestador/longitudinal_c6.py
          src/encuestador/longitudinal_gate_b.py
          src/encuestador/longitudinal_runtime.py
          src/encuestador/time_layer.py
          src/encuestador/cli.py

      - name: Validate all longitudinal arm configs
        run: |
          encuestador longitudinal-validate configs/longitudinal/l10.yaml
          encuestador longitudinal-validate configs/longitudinal/l11.yaml
          encuestador longitudinal-validate configs/longitudinal/l12.yaml
          encuestador longitudinal-validate configs/longitudinal/l12_anchored.yaml
          encuestador longitudinal-validate configs/longitudinal/c7_real_p1r.yaml
          encuestador longitudinal-validate configs/longitudinal/c8_real_p1r.yaml

      - name: Run C4/C6 scientific fixture tests
        run: pytest -q tests/test_longitudinal_runtime.py tests/test_longitudinal_c6.py tests/test_longitudinal_gate_b.py tests/test_longitudinal_c7_contract.py tests/test_longitudinal_c7.py tests/test_longitudinal_c8.py

      - name: Run full repository regression suite
        run: pytest -q
