name: Synthetic transport CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/synthetic-transport-ci.yml
      - .github/workflows/scheduled-transport-maturity.yml
      - contracts/model_specs/historical_staged_v1.json
      - fixtures/semantic_plane/synthetic_fixture_v1.json
      - src/encuestador/transport_proof.py
      - src/encuestador/census_sample_intake.py
      - scripts/synthetic_transport_smoke.py
      - tests/test_transport_proof.py
      - tests/test_census_sample_intake.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/synthetic-transport-ci.yml
      - .github/workflows/scheduled-transport-maturity.yml
      - contracts/model_specs/historical_staged_v1.json
      - fixtures/semantic_plane/synthetic_fixture_v1.json
      - src/encuestador/transport_proof.py
      - src/encuestador/census_sample_intake.py
      - scripts/synthetic_transport_smoke.py
      - tests/test_transport_proof.py
      - tests/test_census_sample_intake.py

permissions:
  contents: read

jobs:
  synthetic-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bounded proof dependencies
        run: python -m pip install numpy pytest ruff
      - name: Lint intake boundary
        run: >-
          ruff check
          src/encuestador/census_sample_intake.py
          tests/test_census_sample_intake.py
      - name: Compile executor and intake
        run: >-
          python -m py_compile
          src/encuestador/transport_proof.py
          src/encuestador/census_sample_intake.py
          scripts/synthetic_transport_smoke.py
          tests/test_transport_proof.py
          tests/test_census_sample_intake.py
      - name: Verify synthetic transport and sampler intake
        run: >-
          pytest -q
          tests/test_transport_proof.py
          tests/test_census_sample_intake.py
      - name: Execute maturity smoke
        run: python scripts/synthetic_transport_smoke.py > /tmp/synthetic-proof.json
